  ];
  const EPSILON_SECONDS = 0.035;
  const videoId = 'deck';

  let video = null;
  let mode = 'loading';
  let currentIndex = 0;
  let targetIndex = null;
  let rafId = 0;
  let playGeneration = 0;

  const state = {
    checkpointIndex: 0,
    targetIndex: null,
    checkpointCount: CHECKPOINTS.length,
    currentTime: 0,
    mode: 'loading'
  };
  window.__flashsketchDeckState = state;

  function checkpoint(index) {
    return CHECKPOINTS[Math.max(0, Math.min(CHECKPOINTS.length - 1, index))];
  }

  function publish() {
    state.checkpointIndex = currentIndex;
    state.targetIndex = targetIndex;
    state.checkpointCount = CHECKPOINTS.length;
    state.currentTime = video ? video.currentTime || 0 : 0;
    state.mode = mode;
    document.documentElement.dataset.checkpointIndex = String(currentIndex);
    document.documentElement.dataset.targetIndex = targetIndex === null ? '' : String(targetIndex);
    document.documentElement.dataset.deckMode = mode;
  }

  function stopTicker() {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  function seekExact(seconds) {
    if (video) {
      video.currentTime = Number.isFinite(seconds) ? seconds : 0;
    }
  }

  function pauseAtCheckpoint(index) {
    const item = checkpoint(index);
    if (!video || !item) {
      return;
    }
    stopTicker();
    playGeneration += 1;
    mode = 'paused';
    currentIndex = item.index;
    targetIndex = null;
    video.pause();
    seekExact(item.time);
    publish();
  }

  function completeIntervalIfReady() {
    if (!video || mode !== 'playing' || targetIndex === null) {
      return;
    }
    const target = checkpoint(targetIndex);
    if (!target) {
      return;
    }
    if (video.ended || video.currentTime + EPSILON_SECONDS >= target.time) {
      pauseAtCheckpoint(targetIndex);
    }
  }

  function tick() {
    rafId = 0;
    completeIntervalIfReady();
    if (mode === 'playing') {
      publish();
      rafId = requestAnimationFrame(tick);
    }
  }

  function playInterval(startIndex, endIndex) {
    const start = checkpoint(startIndex);
    const end = checkpoint(endIndex);
    if (!video || !start || !end) {
      return;
    }
    stopTicker();
    const generation = playGeneration + 1;
    playGeneration = generation;
    mode = 'playing';
    currentIndex = start.index;
    targetIndex = end.index;
    seekExact(start.time);
    publish();
    const playPromise = video.play();
    if (playPromise && typeof playPromise.then === 'function') {
      playPromise.then(() => {
        if (generation !== playGeneration) {
          return;
        }
        completeIntervalIfReady();
        if (mode === 'playing' && !rafId) {
          rafId = requestAnimationFrame(tick);
        }
      }).catch(() => {
        if (generation === playGeneration) {
          pauseAtCheckpoint(start.index);
        }
      });
    } else {
      rafId = requestAnimationFrame(tick);
    }
  }

  function actionNext() {
    if (mode === 'playing') {
      if (targetIndex === null) {
        return;
      }
      if (targetIndex >= CHECKPOINTS.length - 1) {
        pauseAtCheckpoint(targetIndex);
      } else {
        playInterval(targetIndex, targetIndex + 1);
      }
      return;
    }
    if (currentIndex >= CHECKPOINTS.length - 1) {
      return;
    }
    playInterval(currentIndex, currentIndex + 1);
  }

  function actionPrevious() {
    if (mode === 'playing') {
      pauseAtCheckpoint(currentIndex);
      return;
    }
    pauseAtCheckpoint(Math.max(0, currentIndex - 1));
  }

  function actionReplay() {
    if (mode === 'playing') {
      if (targetIndex !== null) {
        playInterval(currentIndex, targetIndex);
      }
      return;
    }
    if (currentIndex === 0) {
      if (CHECKPOINTS.length > 1) {
        playInterval(0, 1);
      }
      return;
    }
    playInterval(currentIndex - 1, currentIndex);
  }

  function handleKeydown(event) {
    if (event.altKey || event.ctrlKey || event.metaKey) {
      return;
    }
    if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'PageDown') {
      event.preventDefault();
      actionNext();
      return;
    }
    if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
      event.preventDefault();
      actionPrevious();
      return;
    }
    if (event.key === 'r') {
      event.preventDefault();
      actionReplay();
    }
  }

  function initialize() {
    video = document.getElementById(videoId);
    document.body.tabIndex = -1;
    document.body.focus({ preventScroll: true });
    window.addEventListener('keydown', handleKeydown, true);
    window.addEventListener('blur', publish);
    video.addEventListener('loadedmetadata', () => pauseAtCheckpoint(0), { once: true });
    video.addEventListener('ended', () => {
      if (mode === 'playing' && targetIndex !== null) {
        pauseAtCheckpoint(targetIndex);
      }
    });
    if (video.readyState >= 1) {
      pauseAtCheckpoint(0);
    } else {
      publish();
    }
  }

  document.addEventListener('DOMContentLoaded', initialize, { once: true });
